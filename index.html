<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoUp Importados — Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1a1a;
  --sidebar:#111111;
  --card:#f5f5f5;
  --text:#ffffff;
  --text-card:#111111;
  --accent:#E8531A;
  --badge:#009EE3;
  --muted:#999999;
  --sidebar-w:115px;
}

*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-weight:400;
  -webkit-font-smoothing:antialiased;
}

img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
button{font-family:inherit;border:none;cursor:pointer}

/* ============ SIDEBAR ============ */
.sidebar{
  position:fixed;
  top:0;left:0;bottom:0;
  width:var(--sidebar-w);
  background:var(--sidebar);
  z-index:100;
  display:flex;
  flex-direction:column;
  padding:28px 0 24px;
  overflow-y:auto;
  scrollbar-width:none;
}
.sidebar::-webkit-scrollbar{display:none}

.logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:-0.03em;
  line-height:1;
  padding:0 18px;
  margin-bottom:46px;
}
.logo .go{color:#d8d8d8}
.logo .up{color:var(--accent)}

.nav{display:flex;flex-direction:column;gap:2px;padding:0 18px}

.nav-item{position:relative}

.nav-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  color:#fff;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.01em;
  padding:9px 0;
  transition:color .18s ease;
  cursor:pointer;
}
.nav-link:hover{color:var(--accent)}
.nav-item.active > .nav-link{color:var(--accent)}

.nav-link .arrow{
  font-size:8px;
  line-height:1;
  opacity:.65;
  transition:transform .22s ease;
}
.nav-item.open .nav-link .arrow{transform:rotate(90deg)}

.submenu{
  display:none;
  flex-direction:column;
  gap:1px;
  padding:2px 0 6px 8px;
  border-left:1px solid #2b2b2b;
  margin-left:1px;
}
.nav-item.open .submenu{display:flex}

.submenu a{
  font-size:10.5px;
  font-weight:400;
  color:#9a9a9a;
  padding:5px 0;
  transition:color .18s ease;
  cursor:pointer;
}
.submenu a:hover{color:#fff}

.sidebar-foot{
  margin-top:auto;
  padding:24px 18px 0;
  font-size:9px;
  line-height:1.6;
  color:#5a5a5a;
  letter-spacing:.02em;
}

/* ============ MAIN ============ */
.main{margin-left:var(--sidebar-w)}

/* ============ HERO ============ */
.hero{
  position:relative;
  height:100vh;
  min-height:560px;
  background:#0d0d0d;
  overflow:hidden;
  display:flex;
  align-items:center;
}
.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center 32%;
}
.hero-bg::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(10,10,10,.9) 0%,rgba(10,10,10,.72) 42%,rgba(10,10,10,.35) 100%);
}

.hero-inner{
  position:relative;
  z-index:2;
  padding:0 70px;
  max-width:820px;
}
.hero-eyebrow{
  font-size:11px;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:22px;
}
.hero h1{
  font-size:66px;
  font-weight:800;
  line-height:1.03;
  letter-spacing:-0.035em;
  margin-bottom:20px;
}
.hero p{
  font-size:14px;
  font-weight:400;
  line-height:1.7;
  color:#d4d4d4;
  max-width:420px;
  margin-bottom:34px;
}
.btn-hero{
  display:inline-block;
  background:var(--badge);
  color:#fff;
  font-size:11px;
  font-weight:700;
  letter-spacing:.14em;
  padding:12px 30px;
  border-radius:2px;
  transition:background .2s ease,transform .2s ease;
  cursor:pointer;
}
.btn-hero:hover{background:#0089c7;transform:translateY(-1px)}

.hero-product{
  position:absolute;
  left:0;bottom:0;
  z-index:3;
  background:rgba(8,8,8,.82);
  backdrop-filter:blur(6px);
  padding:20px 34px 20px 70px;
  border-top:1px solid rgba(255,255,255,.07);
  border-right:1px solid rgba(255,255,255,.07);
}
.hero-product .hp-name{
  font-size:12px;
  font-weight:700;
  letter-spacing:.02em;
  margin-bottom:5px;
}
.hero-product .hp-meta{
  font-size:11px;
  color:#8f8f8f;
}
.hero-product .hp-meta b{color:var(--badge);font-weight:600}

/* ============ CATEGORÍAS ============ */
.cats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
}
.cat{
  position:relative;
  height:400px;
  overflow:hidden;
  background:#101010;
  display:block;
  cursor:pointer;
}
.cat-img{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:brightness(.62);
  transition:transform .7s cubic-bezier(.2,.7,.3,1),filter .5s ease;
}
.cat:hover .cat-img{transform:scale(1.06);filter:brightness(.74)}
.cat::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.1) 45%,rgba(0,0,0,.72) 100%);
}
.cat-label{
  position:absolute;
  top:30px;left:32px;
  z-index:2;
  font-size:20px;
  font-weight:700;
  letter-spacing:-0.02em;
  color:#fff;
}
.cat-desc{
  position:absolute;
  bottom:30px;left:32px;right:32px;
  z-index:2;
  font-size:11.5px;
  line-height:1.6;
  color:#c9c9c9;
}
.cat-desc span{
  display:block;
  margin-top:9px;
  font-size:10px;
  font-weight:700;
  letter-spacing:.14em;
  color:var(--accent);
}

/* ============ MARCAS ============ */
.brands{
  background:#222222;
  padding:52px 70px;
}
.brands h3{
  font-size:10px;
  font-weight:700;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:#6e6e6e;
  text-align:center;
  margin-bottom:30px;
}
.brands-row{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px 54px;
}
.brand{
  font-size:19px;
  font-weight:800;
  letter-spacing:.06em;
  color:#b5b5b5;
  transition:color .2s ease;
  cursor:default;
}
.brand:hover{color:#fff}
.brand-dot{color:#4a4a4a;font-size:14px}

/* ============ PRODUCTOS ============ */
.products{padding:86px 70px 96px}

.products-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:30px;
  margin-bottom:28px;
  flex-wrap:wrap;
}
.products h2{
  font-size:38px;
  font-weight:800;
  letter-spacing:-0.035em;
  line-height:1.1;
}
.products-head p{
  font-size:12px;
  color:#8c8c8c;
  line-height:1.6;
  max-width:300px;
}

.filters{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:44px;
}
.pill{
  background:transparent;
  color:#b0b0b0;
  border:1px solid #333;
  font-size:11px;
  font-weight:600;
  letter-spacing:.03em;
  padding:9px 20px;
  border-radius:999px;
  transition:all .2s ease;
}
.pill:hover{border-color:#5c5c5c;color:#fff}
.pill.active{
  background:var(--badge);
  border-color:var(--badge);
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:26px;
}

.card{
  background:var(--card);
  border-radius:3px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:transform .3s ease,box-shadow .3s ease;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 18px 40px rgba(0,0,0,.45);
}

.card-media{
  position:relative;
  background:#ffffff;
  padding:40px 34px;
  height:330px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card-media img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  transition:transform .45s cubic-bezier(.2,.7,.3,1);
}
/* Fotos de ambiente: llenan la caja en lugar de flotar sobre blanco */
.card-media.fill{padding:0}
.card-media.fill img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.card:hover .card-media img{transform:scale(1.045)}

.tag-off{
  position:absolute;
  top:14px;left:14px;
  z-index:2;
  background:var(--accent);
  color:#fff;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.09em;
  padding:5px 9px;
  border-radius:2px;
}

.card-body{
  padding:20px 22px 24px;
  color:var(--text-card);
  display:flex;
  flex-direction:column;
  gap:9px;
  flex:1;
}
.card-name{
  font-size:13px;
  font-weight:600;
  line-height:1.45;
  letter-spacing:-0.005em;
}
.card-prices{
  display:flex;
  align-items:baseline;
  gap:9px;
  flex-wrap:wrap;
}
.price{
  font-size:18px;
  font-weight:700;
  letter-spacing:-0.02em;
}
.price-old{
  font-size:12px;
  font-weight:400;
  color:var(--muted);
  text-decoration:line-through;
}
.badge-cuotas{
  align-self:flex-start;
  background:var(--badge);
  color:#fff;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.04em;
  padding:4px 9px;
  border-radius:2px;
  margin-top:auto;
}

.empty{
  grid-column:1/-1;
  padding:50px 0;
  text-align:center;
  font-size:12px;
  color:#7d7d7d;
}

/* ============ CONTACTO ============ */
.contacto{padding:120px 70px 96px;max-width:1080px}
.contacto h1{
  font-size:52px;
  font-weight:800;
  letter-spacing:-0.035em;
  line-height:1.05;
  margin-bottom:16px;
}
.contacto .sub{
  font-size:13px;
  line-height:1.75;
  color:#9a9a9a;
  max-width:460px;
  margin-bottom:54px;
}
.contacto-grid{
  display:grid;
  grid-template-columns:1fr 1.15fr;
  gap:56px;
  align-items:start;
}
.info-block{margin-bottom:30px}
.info-block h4{
  font-size:10px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:9px;
}
.info-block p,.info-block a{
  font-size:13px;
  line-height:1.8;
  color:#cfcfcf;
}
.info-block a:hover{color:#fff}

.form{
  background:#212121;
  border:1px solid #2e2e2e;
  border-radius:4px;
  padding:34px;
}
.field{margin-bottom:18px}
.field label{
  display:block;
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#8f8f8f;
  margin-bottom:7px;
}
.field input,.field select,.field textarea{
  width:100%;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:3px;
  color:#fff;
  font-family:inherit;
  font-size:13px;
  padding:11px 13px;
  transition:border-color .2s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;
  border-color:var(--badge);
}
.field textarea{resize:vertical;min-height:96px}
.btn-form{
  width:100%;
  background:var(--accent);
  color:#fff;
  font-size:11px;
  font-weight:700;
  letter-spacing:.14em;
  padding:13px;
  border-radius:3px;
  transition:background .2s ease;
}
.btn-form:hover{background:#cf4514}
.form-ok{
  display:none;
  margin-top:16px;
  background:rgba(37,211,102,.12);
  border:1px solid rgba(37,211,102,.35);
  border-radius:3px;
  padding:12px 14px;
  font-size:12px;
  line-height:1.6;
  color:#6fe39b;
}
.form-ok.show{display:block}

/* ============ FOOTER ============ */
.footer{
  border-top:1px solid #2a2a2a;
  padding:46px 70px 54px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:40px;
  flex-wrap:wrap;
}
.footer .logo{margin:0 0 12px;padding:0;font-size:26px}
.footer-col p{font-size:11px;line-height:1.85;color:#7d7d7d}
.footer-col h4{
  font-size:10px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#fff;
  margin-bottom:12px;
}
.footer-col a{
  display:block;
  font-size:11px;
  line-height:2;
  color:#7d7d7d;
  transition:color .18s ease;
  cursor:pointer;
}
.footer-col a:hover{color:var(--accent)}

/* ============ FLOTANTES ============ */
.demo-badge{
  position:fixed;
  top:18px;right:18px;
  z-index:200;
  background:var(--accent);
  color:#fff;
  font-size:9.5px;
  font-weight:700;
  letter-spacing:.16em;
  padding:7px 13px;
  border-radius:2px;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}

.whatsapp{
  position:fixed;
  right:22px;bottom:22px;
  z-index:200;
  width:54px;height:54px;
  border-radius:50%;
  background:#25D366;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
  transition:transform .22s ease;
}
.whatsapp:hover{transform:scale(1.07)}
.whatsapp svg{width:29px;height:29px;fill:#fff}

/* ============ RESPONSIVE ============ */
@media (max-width:1100px){
  .grid,.cats{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:50px}
  .hero-inner,.products,.brands,.footer,.contacto{padding-left:44px;padding-right:44px}
  .hero-product{padding-left:44px}
  .contacto-grid{grid-template-columns:1fr;gap:40px}
}
@media (max-width:720px){
  :root{--sidebar-w:78px}
  .logo{font-size:21px;padding:0 12px}
  .nav{padding:0 12px}
  .nav-link{font-size:10.5px}
  .grid,.cats{grid-template-columns:1fr}
  .hero{height:auto;min-height:0;padding:110px 0 0}
  .hero h1{font-size:34px}
  .hero-inner,.products,.brands,.footer,.contacto{padding-left:22px;padding-right:22px}
  .hero-inner{padding-bottom:150px}
  .hero-product{padding:16px 22px;right:0}
  .products h2{font-size:27px}
  .contacto h1{font-size:34px}
  .cat{height:290px}
  .card-media{height:250px;padding:26px}
  .products{padding-top:54px;padding-bottom:62px}
  .contacto{padding-top:80px}
}
</style>
</head>

var ORDEN = ['stanley','drones','monopatines','perfumes','electro'];

/* ==========================================================
   UTILIDADES
   ========================================================== */
function precioARS(n){
  return '$' + n.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function descuento(p){
  if(!p.antes) return '';
  return Math.round((1 - p.precio / p.antes) * 100) + '% OFF';
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ==========================================================
   SIDEBAR
   ========================================================== */
function renderNav(activa){
  var html = '<div class="nav-item' + (activa === 'inicio' ? ' active' : '') + '">' +
             '<a class="nav-link" onclick="irA(\'inicio\')">Inicio</a></div>';

  ORDEN.forEach(function(key){
    var c = CATALOGO[key];
    var abierta = (activa === key);
    html += '<div class="nav-item' + (abierta ? ' active open' : '') + '">' +
              '<div class="nav-link" onclick="irA(\'' + key + '\')">' +
                '<span>' + c.nav + '</span><span class="arrow">&#9654;</span>' +
              '</div>' +
              '<div class="submenu">' +
                c.submenu.map(function(f){
                  return '<a onclick="event.stopPropagation(); irA(\'' + key + '\',\'' + esc(f) + '\')">' + f + '</a>';
                }).join('') +
              '</div>' +
            '</div>';
  });

  html += '<div class="nav-item' + (activa === 'contacto' ? ' active' : '') + '">' +
          '<a class="nav-link" onclick="irA(\'contacto\')">Contacto</a></div>';

  document.getElementById('nav').innerHTML = html;
}

/* ==========================================================
   BLOQUES DE PÁGINA
   ========================================================== */
function bloqueHero(c, key){
  var h = c.hero;
  return '<section class="hero">' +
    '<div class="hero-bg" style="background-image:url(\'' + IMG + h.img + '\');background-position:' + (h.pos || 'center 32%') + '"></div>' +
    '<div class="hero-inner">' +
      '<div class="hero-eyebrow">' + h.eyebrow + '</div>' +
      '<h1>' + h.titulo + '</h1>' +
      '<p>' + h.texto + '</p>' +
      '<a class="btn-hero" onclick="scrollAProductos()">COMPRAR</a>' +
    '</div>' +
    '<div class="hero-product">' +
      '<div class="hp-name">' + h.destacado.nombre + '</div>' +
      '<div class="hp-meta">' + h.destacado.precio + ' &nbsp;·&nbsp; <b>' + h.destacado.cuotas + '</b></div>' +
    '</div>' +
  '</section>';
}

function bloqueCats(c, key){
  return '<section class="cats">' + c.cats.map(function(cat){
    return '<a class="cat" onclick="irA(\'' + key + '\')">' +
      '<div class="cat-img" style="background-image:url(\'' + IMG + cat.img + '\')"></div>' +
      '<div class="cat-label">' + cat.label + '</div>' +
      '<div class="cat-desc">' + cat.desc + '<span>VER CATEGORÍA</span></div>' +
    '</a>';
  }).join('') + '</section>';
}

function bloqueMarcas(){
  var marcas = ['STANLEY','DJI','XIAOMI','JBL','RAY-BAN'];
  return '<section class="brands">' +
    '<h3>Nuestras marcas</h3>' +
    '<div class="brands-row">' +
      marcas.map(function(m){ return '<span class="brand">' + m + '</span>'; })
            .join('<span class="brand-dot">·</span>') +
    '</div>' +
  '</section>';
}

function tarjeta(p){
  var off = descuento(p);
  return '<article class="card">' +
    '<div class="card-media' + (p.fill ? ' fill' : '') + '">' +
      (off ? '<span class="tag-off">' + off + '</span>' : '') +
      '<img src="' + IMG + p.img + '" alt="' + esc(p.nombre) + '" loading="lazy">' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="card-name">' + p.nombre + '</div>' +
      '<div class="card-prices">' +
        '<span class="price">' + precioARS(p.precio) + '</span>' +
        (p.antes ? '<span class="price-old">' + precioARS(p.antes) + '</span>' : '') +
      '</div>' +
      '<span class="badge-cuotas">' + p.cuotas + ' sin interés</span>' +
    '</div>' +
  '</article>';
}

function bloqueProductos(c, key, filtro){
  var pills = c.submenu.map(function(f){
    return '<button class="pill' + (f === filtro ? ' active' : '') + '" onclick="irA(\'' + key + '\',\'' + esc(f) + '\')">' + f + '</button>';
  }).join('');

  var lista = c.productos.filter(function(p){ return p.filtros.indexOf(filtro) !== -1; });
  var cards = lista.length
    ? lista.map(tarjeta).join('')
    : '<div class="empty">No hay productos en esta categoría por el momento.</div>';

  return '<section class="products" id="productos">' +
    '<div class="products-head">' +
      '<h2>' + c.seccion.titulo + '</h2>' +
      '<p>' + c.seccion.bajada + '</p>' +
    '</div>' +
    '<div class="filters">' + pills + '</div>' +
    '<div class="grid">' + cards + '</div>' +
  '</section>';
}

function bloqueFooter(){
  return '<footer class="footer">' +
    '<div class="footer-col">' +
      '<div class="logo"><span class="go">go</span><span class="up">up</span></div>' +
      '<p>Importados originales<br>Envíos a todo el país</p>' +
    '</div>' +
    '<div class="footer-col">' +
      '<h4>Tienda</h4>' +
      ORDEN.map(function(k){ return '<a onclick="irA(\'' + k + '\')">' + CATALOGO[k].nav + '</a>'; }).join('') +
    '</div>' +
    '<div class="footer-col">' +
      '<h4>Ayuda</h4>' +
      '<a onclick="irA(\'contacto\')">Cómo comprar</a>' +
      '<a onclick="irA(\'contacto\')">Envíos y entregas</a>' +
      '<a onclick="irA(\'contacto\')">Cambios y devoluciones</a>' +
      '<a onclick="irA(\'contacto\')">Contacto</a>' +
    '</div>' +
    '<div class="footer-col">' +
      '<h4>Seguinos</h4>' +
      '<a href="#">Instagram</a><a href="#">WhatsApp</a><a href="#">TikTok</a>' +
    '</div>' +
  '</footer>';
}

function vistaContacto(){
  return '<section class="contacto">' +
    '<h1>Hablemos</h1>' +
    '<p class="sub">Contanos qué estás buscando y te pasamos precio, stock y formas de pago. Si no lo tenemos, lo traemos a pedido.</p>' +
    '<div class="contacto-grid">' +
      '<div>' +
        '<div class="info-block"><h4>WhatsApp</h4><p>+54 9 11 5555-0142<br>Lun a Vie 9 a 19 · Sáb 9 a 13</p></div>' +
        '<div class="info-block"><h4>Showroom</h4><p>Av. Corrientes 1234, CABA<br>Con cita previa</p></div>' +
        '<div class="info-block"><h4>Email</h4><a href="#">hola@goupimportados.com.ar</a></div>' +
        '<div class="info-block"><h4>Envíos</h4><p>Andreani y Correo Argentino a todo el país.<br>CABA y GBA: entrega en 24/48 hs.</p></div>' +
      '</div>' +
      '<form class="form" onsubmit="enviarForm(event)">' +
        '<div class="field"><label>Nombre</label><input type="text" required placeholder="Tu nombre"></div>' +
        '<div class="field"><label>WhatsApp o email</label><input type="text" required placeholder="Cómo te contactamos"></div>' +
        '<div class="field"><label>¿Qué te interesa?</label><select>' +
          ORDEN.map(function(k){ return '<option>' + CATALOGO[k].nav + '</option>'; }).join('') +
          '<option>Otro producto</option>' +
        '</select></div>' +
        '<div class="field"><label>Mensaje</label><textarea placeholder="Contanos qué estás buscando"></textarea></div>' +
        '<button class="btn-form" type="submit">ENVIAR CONSULTA</button>' +
        '<div class="form-ok" id="formOk">¡Listo! Es una demo, así que el mensaje no se envía a ningún lado. En la tienda real te responderíamos por WhatsApp en el día.</div>' +
      '</form>' +
    '</div>' +
  '</section>';
}

/* ==========================================================
   ROUTER
   ========================================================== */
function irA(vista, filtro){
  location.hash = '#/' + vista + (filtro ? '/' + encodeURIComponent(filtro) : '');
}

function render(){
  var partes = location.hash.replace(/^#\//,'').split('/');
  var vista  = partes[0] || 'inicio';
  var filtro = partes[1] ? decodeURIComponent(partes[1]) : null;

  var main = document.getElementById('main');

  if(vista === 'contacto'){
    main.innerHTML = vistaContacto() + bloqueFooter();
    renderNav('contacto');
    window.scrollTo(0,0);
    return;
  }

  // "inicio" muestra la portada Stanley, pero deja Inicio marcado en el menú
  var key = (vista === 'inicio') ? 'stanley' : vista;
  var c = CATALOGO[key];

  if(!c){ location.hash = '#/inicio'; return; }

  if(!filtro || c.submenu.indexOf(filtro) === -1) filtro = c.submenu[0];

  main.innerHTML = bloqueHero(c, key) +
                   bloqueCats(c, key) +
                   bloqueMarcas() +
                   bloqueProductos(c, key, filtro) +
                   bloqueFooter();

  renderNav(vista === 'inicio' ? 'inicio' : key);

  // Al cambiar sólo el filtro dentro de la misma vista, no saltamos arriba
  if(vistaAnterior !== vista){ window.scrollTo(0,0); }
  else if(filtroAnterior !== filtro){ scrollAProductos(); }

  vistaAnterior = vista;
  filtroAnterior = filtro;
}

var vistaAnterior = null;
var filtroAnterior = null;

function scrollAProductos(){
  var el = document.getElementById('productos');
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function enviarForm(e){
  e.preventDefault();
  document.getElementById('formOk').classList.add('show');
  e.target.querySelector('input').focus();
}

window.addEventListener('hashchange', render);
render();
</script>
